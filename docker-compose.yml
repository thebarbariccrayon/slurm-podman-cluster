      userPassword: @USER_PW@

      dn: uid=bob,ou=people,dc=cluster,dc=local
      objectClass: inetOrgPerson
      objectClass: posixAccount
      uid: bob
      cn: Bob Physicist
      sn: Physicist
      uidNumber: 3002
      gidNumber: 4001
      homeDirectory: /shared/home/bob
