# slurm-dc2.conf
#
# Second cluster ("data center 2") for the federation demo, enabled with
# `make up FEDERATION=1`. Identical to slurm.conf except for the cluster name,
# controller, nodes and partitions; see slurm.conf for what each setting does.
#
# Both clusters use the same slurmdbd, which is what lets them form a
# federation. The partitions debug, batch and all exist in both clusters, so a
# job submitted to any of them is copied to both and runs on whichever cluster
# can start it first. gpu exists only in the first cluster, so gpu jobs stay
# there.

ClusterName=freya
ControlMachine=dc2-controller

SlurmctldParameters=enable_configless

AuthType=auth/munge
CryptoType=crypto/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

SlurmUser=slurm
SlurmdUser=root

SlurmctldPort=6817
SlurmdPort=6818

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
ReturnToService=1

SchedulerType=sched/backfill
SchedulerParameters=bf_interval=5,sched_interval=10
SwitchType=switch/none
MpiDefault=pmix

ProctrackType=proctrack/cgroup
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
TaskPlugin=task/cgroup

SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctl.log
SlurmctldDebug=4
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmdDebug=4

JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/slurm_job_completions.log

SlurmctldTimeout=300
SlurmdTimeout=300

JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageUser=slurm
AccountingStoragePort=6819

#####################
# Node Definitions  #
#####################
NodeName=dc2-compute[1-3] CPUs=4 RealMemory=1024 State=UNKNOWN

##########################
# Partition Definitions  #
##########################
# Same names as in the first cluster; no gpu partition here.
PartitionName=debug Nodes=dc2-compute1 Default=YES MaxTime=01:00:00 State=UP
PartitionName=batch Nodes=dc2-compute[2-3] MaxTime=24:00:00 State=UP
PartitionName=all Nodes=dc2-compute[1-3] MaxTime=INFINITE State=UP
