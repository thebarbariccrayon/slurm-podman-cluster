# slurm.conf: data center 1 (homelab-cluster).
#
# Baked into the image and installed by entrypoint.sh on the controller,
# slurmrestd, login and directory-sync containers. Compute nodes fetch it from
# the controller (configless). Rebuild with `make up` after editing.
# slurm-dc2.conf is the same apart from cluster identity, nodes and
# partitions; keep the two in step.

# --- Identity and controller ---
ClusterName=odin
ControlMachine=controller
# Serve this file (and cgroup.conf) to slurmd started with --conf-server.
SlurmctldParameters=enable_configless

# --- Authentication ---
# MUNGE between daemons; JWT for slurmrestd and Slurm-web. The JWT key is
# shared by both clusters and slurmdbd (secrets-init creates it).
AuthType=auth/munge
CryptoType=crypto/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

# --- Daemon users and ports ---
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818

# --- State ---
# slurmctld-state volume: jobs and the job ID counter survive restarts.
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
# A node marked down for not responding returns by itself once it registers
# again, e.g. after its container restarts.
ReturnToService=1

# --- Scheduling ---
SchedulerType=sched/backfill
# Backfill every 5 s and the main scheduler every 10 s instead of 30 s / 60 s.
# A federated cluster starts the sibling jobs it receives on these passes, so
# short intervals let a job move to the other data center promptly; they are
# cheap at this size.
SchedulerParameters=bf_interval=5,sched_interval=10
SwitchType=switch/none
MpiDefault=pmix

# --- Resource tracking and enforcement ---
# Jobs get cores and memory, not whole nodes, and run in cgroups that track
# their processes and enforce the limits (cgroup.conf is in the Dockerfile).
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup

# --- PID files and logs (inside each container; see `make logs` for stdout) ---
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctl.log
SlurmctldDebug=4
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmdDebug=4
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/slurm_job_completions.log

# Generous timeouts: containers on a busy laptop can stall for a while.
SlurmctldTimeout=300
SlurmdTimeout=300

# --- Accounting (slurmdbd, shared with the second cluster) ---
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageUser=slurm
AccountingStoragePort=6819

# --- Nodes ---
# RealMemory matches what each container may use; jobs asking for more wait.
NodeName=compute[1-5] CPUs=4 RealMemory=1024 State=UNKNOWN

# --- Partitions ---
# debug, batch and all also exist in data center 2, so federated jobs for
# them can run in either; gpu is only here. compute5 has no real GPU.
PartitionName=debug Nodes=compute[1-2] Default=YES MaxTime=01:00:00 State=UP
PartitionName=batch Nodes=compute[3-4] MaxTime=24:00:00 State=UP
PartitionName=gpu Nodes=compute5 MaxTime=48:00:00 State=UP
PartitionName=all Nodes=compute[1-5] MaxTime=INFINITE State=UP
