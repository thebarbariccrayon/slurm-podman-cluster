# slurmdbd.conf: the accounting daemon shared by both clusters.
#
# Installed by entrypoint.sh with mode 0600 (slurmdbd refuses a readable file,
# since it holds the database password). Rebuild with `make up` after editing.

# MUNGE for the Slurm daemons; JWT so slurmrestd (and Slurm-web through it)
# can query accounting.
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

DbdHost=slurmdbd
DbdPort=6819
SlurmUser=slurm

DebugLevel=4
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurm/slurmdbd.pid

# MariaDB container; these credentials match its environment in
# docker-compose.yml.
StorageType=accounting_storage/mysql
StorageHost=mariadb
StoragePort=3306
StorageLoc=slurm_acct_db
StorageUser=slurm
StoragePass=slurmdbpass
